<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Resume Analysis Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg-dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            color: var(--text);
            padding: 2rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(to right, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 2rem;
            border-radius: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
        }

        th {
            text-align: left;
            padding: 1rem;
            color: var(--primary);
            border-bottom: 1px solid var(--glass-border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .badge {
            padding: 0.25rem 0.75rem;
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 50px;
            font-size: 0.85rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            background: var(--primary);
            color: #0f172a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .empty-state {
            text-align: center;
            padding: 4rem;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <div class="container">
        <nav>
            <div class="logo">Resume Analysis Pro</div>
            <a href="/admin/security" class="btn"
                style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #cbd5e1;">🛡️
                Security Audit</a>
        </nav>

        <div class="card">
            <h1 style="font-size: 2rem; margin-bottom: 1rem; text-align: center;">Welcome to Resume Analysis Pro</h1>
            <p style="text-align: center; color: #94a3b8; margin-bottom: 3rem; font-size: 1.05rem;">Upload your resume
                and get instant matching analysis against job requirements</p>

            <div
                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">
                <div
                    style="text-align: center; padding: 2rem; background: rgba(0, 210, 255, 0.05); border-radius: 12px; border: 1px solid rgba(0, 210, 255, 0.1);">
                    <div style="font-size: 2rem; margin-bottom: 0.5rem;">📄</div>
                    <div style="color: #cbd5e1; font-size: 0.9rem;">Upload Your Resume</div>
                </div>
                <div
                    style="text-align: center; padding: 2rem; background: rgba(58, 123, 213, 0.05); border-radius: 12px; border: 1px solid rgba(58, 123, 213, 0.1);">
                    <div style="font-size: 2rem; margin-bottom: 0.5rem;">🔍</div>
                    <div style="color: #cbd5e1; font-size: 0.9rem;">Get Instant Analysis</div>
                </div>
                <div
                    style="text-align: center; padding: 2rem; background: rgba(74, 222, 128, 0.05); border-radius: 12px; border: 1px solid rgba(74, 222, 128, 0.1);">
                    <div style="font-size: 2rem; margin-bottom: 0.5rem;">⭐</div>
                    <div style="color: #cbd5e1; font-size: 0.9rem;">See Match Score</div>
                </div>
            </div>

            <a href="/upload" class="btn"
                style="display: block; text-align: center; padding: 1.2rem; font-size: 1rem; background: linear-gradient(to right, #00d2ff, #3a7bd5); border: none; cursor: pointer; color: #0f172a; text-decoration: none; font-weight: 600; border-radius: 10px; transition: all 0.3s; margin-bottom: 1rem;"
                onmouseover="this.style.opacity='0.9'; this.style.transform='translateY(-2px)'"
                onmouseout="this.style.opacity='1'; this.style.transform='translateY(0)'">Start New Analysis</a>

            <a href="/results/latest" class="btn"
                style="display: block; text-align: center; padding: 1.2rem; font-size: 1rem; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); cursor: pointer; color: #f8fafc; text-decoration: none; font-weight: 600; border-radius: 10px; transition: all 0.3s;"
                onmouseover="this.style.background='rgba(255, 255, 255, 0.15)'"
                onmouseout="this.style.background='rgba(255, 255, 255, 0.1)'">View Latest Results</a>
        </div>
    </div>
</body>

</html>
