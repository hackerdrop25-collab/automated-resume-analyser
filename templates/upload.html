<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Resume Analysis - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg-dark: #020617;
            --glass: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text: #f1f5f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            color: var(--text);
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.25rem 2rem;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            margin-bottom: 3rem;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--glass);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            padding: 3.5rem;
            border-radius: 32px;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 10;
        }

        h1 {
            text-align: center;
            margin-bottom: 2.5rem;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(to bottom, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 2rem;
        }

        label {
            display: block;
            margin-bottom: 0.75rem;
            color: #94a3b8;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 1.125rem 1.5rem;
            background: rgba(2, 6, 23, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(2, 6, 23, 0.8);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.1);
        }

        .drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
            margin-top: 1rem;
            position: relative;
            overflow: hidden;
        }

        .drop-zone:hover {
            border-color: var(--primary);
            background: rgba(0, 242, 254, 0.03);
            transform: scale(1.02);
        }

        .btn-submit {
            width: 100%;
            padding: 1.25rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 18px;
            color: #020617;
            font-weight: 700;
            font-size: 1.125rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            box-shadow: 0 20px 40px -10px rgba(0, 242, 254, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -15px rgba(0, 242, 254, 0.5);
            filter: brightness(1.1);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(20px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(0, 242, 254, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .progress-text {
            margin-top: 2.5rem;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .flash-message {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .flash-danger {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.2);
            color: #f87171;
        }

        .flash-success {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.2);
            color: var(--primary);
        }
    </style>
</head>

<body>


    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <div class="progress-text">Neural engines analyzing...</div>
        <p style="color: #64748b; margin-top: 1rem; font-weight: 500;">Synthesizing resume insights</p>
    </div>

    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash-message flash-{{ 'danger' if category == 'danger' else 'success' }}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <h1>Intelligent Analysis</h1>

        <form action="/upload" method="POST" enctype="multipart/form-data" id="analysis-form">
            <div style="display: grid; grid-template-columns: 1fr 200px; gap: 2rem;">
                <div class="form-group">
                    <label>Target Role</label>
                    <input type="text" name="job_title" placeholder="e.g. Senior Software Engineer" required>
                </div>
                <div class="form-group">
                    <label>Min Years Exp</label>
                    <input type="number" name="experience" placeholder="e.g. 5" required>
                </div>
            </div>

            <div class="form-group">
                <label>Desired Certifications</label>
                <input type="text" name="certifications" placeholder="e.g. AWS Solutions Architect, PMP">
            </div>

            <div class="form-group">
                <label>Requirement Context</label>
                <textarea name="project_description" rows="5"
                    placeholder="Describe specific tech stack, project goals, or leadership needs..."></textarea>
            </div>

            <div class="form-group">
                <label>Batch Size (1-10 Resumes)</label>
                <input type="number" id="num_resumes" name="num_resumes" min="1" max="10" value="1"
                    onchange="generateInputs()" style="border-style: solid;">
            </div>

            <div id="file-inputs" style="margin-top: 1.5rem;">
                <!-- Inputs generated here -->
                <div class="drop-zone">
                    <p style="color: #64748b; font-weight: 500;">Select Resume (PDF/DOCX)</p>
                    <input type="file" id="file-1" name="resume_1" accept=".pdf,.docx" required>
                    <p id="label-1"
                        style="color: var(--primary); margin-top: 0.75rem; font-weight: 700; font-size: 0.875rem;">
                    </p>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <span>Start AI Analysis</span>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                </svg>
            </button>
        </form>
    </div>


</body>

</html>
