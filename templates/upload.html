<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Analyzer - Advanced Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg-dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text);
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
        }

        .blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            filter: blur(100px);
            border-radius: 50%;
            opacity: 0.1;
            z-index: -1;
        }

        .blob-1 {
            top: -200px;
            left: -200px;
        }

        .blob-2 {
            bottom: -200px;
            right: -200px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(to right, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logout-btn {
            padding: 0.5rem 1rem;
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 3rem;
            border-radius: 24px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
            font-size: 0.875rem;
        }

        input[type="text"],
        input[type="number"],
        input[type="file"],
        textarea {
            width: 100%;
            padding: 0.875rem 1.25rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 210, 255, 0.1);
        }

        button[type="submit"] {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border: none;
            border-radius: 12px;
            color: #0f172a;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 2rem;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 210, 255, 0.3);
        }

        .resumes-container {
            margin-top: 2rem;
            display: grid;
            gap: 1rem;
        }

        .resume-input-group {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>

<body>
    <div class="animated-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <nav>
        <div class="logo">Resume Analysis Pro</div>
        <div class="user-info">
            <span>{{ current_user.email }}</span>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h1>Analysis Configuration</h1>
        <form action="/" method="POST" enctype="multipart/form-data">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                <div class="form-group">
                    <label for="job_title">Job Title</label>
                    <input type="text" id="job_title" name="job_title" placeholder="e.g. Senior Software Engineer"
                        required>
                </div>
                <div class="form-group">
                    <label for="experience">Required Experience (Years)</label>
                    <input type="number" id="experience" name="experience" placeholder="e.g. 5" required>
                </div>
            </div>

            <div class="form-group">
                <label for="certifications">Required Certifications</label>
                <input type="text" id="certifications" name="certifications" placeholder="e.g. AWS Certified, PMP">
            </div>

            <div class="form-group">
                <label for="project_description">Project Description / Detailed Requirements</label>
                <textarea id="project_description" name="project_description" rows="4"
                    placeholder="Paste detailed job description or project requirements here..."></textarea>
            </div>

            <div class="form-group">
                <label for="num_resumes">Number of Resumes to Analyze (Max 10)</label>
                <input type="number" id="num_resumes" name="num_resumes" min="1" max="10" value="1"
                    onchange="updateResumeInputs()">
            </div>

            <div id="resumes-container" class="resumes-container">
                <div class="form-group resume-input-group">
                    <label>Resume 1 (PDF)</label>
                    <input type="file" name="resume_1" accept=".pdf" required>
                </div>
            </div>

            <button type="submit">Start Advanced Analysis</button>
        </form>
    </div>

    <script>
        function updateResumeInputs() {
            const num = document.getElementById('num_resumes').value;
            const container = document.getElementById('resumes-container');
            container.innerHTML = '';
            for (let i = 1; i <= num; i++) {
                const div = document.createElement('div');
                div.className = 'form-group resume-input-group';
                div.innerHTML = `<label>Resume ${i} (PDF)</label><input type="file" name="resume_${i}" accept=".pdf" required>`;
                container.appendChild(div);
            }
        }
    </script>
</body>

</html>
