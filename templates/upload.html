<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Resume Analysis - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg-dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            color: var(--text);
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
        }

        .blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            filter: blur(100px);
            border-radius: 50%;
            opacity: 0.1;
            z-index: -1;
        }

        .blob-1 {
            top: -200px;
            left: -200px;
        }

        .blob-2 {
            bottom: -200px;
            right: -200px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(to right, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
            font-size: 0.875rem;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 0.875rem 1.25rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .drop-zone {
            border: 2px dashed var(--glass-border);
            border-radius: 16px;
            padding: 2.5rem;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            background: rgba(15, 23, 42, 0.3);
            margin-top: 1rem;
        }

        .drop-zone:hover,
        .drop-zone.active {
            border-color: var(--primary);
            background: rgba(0, 210, 255, 0.05);
        }

        .btn-submit {
            width: 100%;
            padding: 1.25rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border: none;
            border-radius: 14px;
            color: #0f172a;
            font-weight: 700;
            font-size: 1.125rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px -5px rgba(0, 210, 255, 0.4);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .spinner {
            width: 70px;
            height: 70px;
            border: 5px solid rgba(0, 210, 255, 0.1);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .progress-text {
            margin-top: 2rem;
            font-size: 1.25rem;
            font-weight: 500;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body>
    <div class="animated-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <div class="progress-text">AI is analyzing resumes...</div>
        <p style="color: #64748b; margin-top: 1rem;">This may take a moment</p>
    </div>

    <nav>
        <div class="logo">Resume Analysis Pro</div>
        <div style="display: flex; align-items: center; gap: 1.5rem;">
            <a href="/history" style="color: #cbd5e1; text-decoration: none; font-weight: 500;">History</a>
            <a href="/logout"
                style="color: #f87171; text-decoration: none; padding: 0.5rem 1rem; background: rgba(239, 68, 68, 0.1); border-radius: 8px;">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h1 style="text-align: center; margin-bottom: 2rem; font-size: 2rem;">Real-Time AI Analysis</h1>

        <form action="/" method="POST" enctype="multipart/form-data" id="analysis-form">
            <div style="display: grid; grid-template-columns: 1fr 150px; gap: 1.5rem;">
                <div class="form-group">
                    <label>Target Job Title</label>
                    <input type="text" name="job_title" placeholder="e.g. Full Stack Developer" required>
                </div>
                <div class="form-group">
                    <label>Min Experience</label>
                    <input type="number" name="experience" placeholder="e.g. 3" required>
                </div>
            </div>

            <div class="form-group">
                <label>Key Certifications (Optional)</label>
                <input type="text" name="certifications" placeholder="e.g. AWS, Azure, Google Cloud">
            </div>

            <div class="form-group">
                <label>Detailed Project Requirements</label>
                <textarea name="project_description" rows="4"
                    placeholder="Paste key responsibilities and technical requirements..."></textarea>
            </div>

            <div class="form-group">
                <label>Number of Resumes (1-10)</label>
                <input type="number" id="num_resumes" name="num_resumes" min="1" max="10" value="1"
                    onchange="generateInputs()">
            </div>

            <div id="file-inputs" style="margin-top: 1rem;">
                <!-- Inputs generated here -->
                <div class="drop-zone" onclick="document.getElementById('file-1').click()">
                    <p style="color: #94a3b8;">Click or Drag Resume 1 (PDF/DOCX)</p>
                    <input type="file" id="file-1" name="resume_1" accept=".pdf,.docx" style="display: none;" required
                        onchange="updateLabel(1)">
                    <p id="label-1"
                        style="color: var(--primary); margin-top: 0.5rem; font-weight: 600; font-size: 0.85rem;"></p>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <span>Start Advanced Analysis</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </form>
    </div>

    <script>
        function generateInputs() {
            const num = document.getElementById('num_resumes').value;
            const container = document.getElementById('file-inputs');
            container.innerHTML = '';
            for (let i = 1; i <= num; i++) {
                const zone = document.createElement('div');
                zone.className = 'drop-zone';
                zone.onclick = () => document.getElementById(`file-${i}`).click();
                zone.innerHTML = `
                    <p style="color: #94a3b8;">Click or Drag Resume ${i} (PDF/DOCX)</p>
                    <input type="file" id="file-${i}" name="resume_${i}" accept=".pdf,.docx" style="display: none;" required onchange="updateLabel(${i})">
                    <p id="label-${i}" style="color: var(--primary); margin-top: 0.5rem; font-weight: 600; font-size: 0.85rem;"></p>
                `;
                container.appendChild(zone);
            }
        }

        function updateLabel(id) {
            const input = document.getElementById(`file-${id}`);
            const label = document.getElementById(`label-${id}`);
            if (input.files && input.files[0]) {
                label.innerText = "Selected: " + input.files[0].name;
            }
        }

        document.getElementById('analysis-form').onsubmit = function () {
            document.getElementById('loading').style.display = 'flex';

            const messages = [
                "Extracting text from resumes...",
                "Analyzing technical skills...",
                "Matching experience requirements...",
                "Checking certification validity...",
                "Formatting results for your dashboard...",
                "Almost there! Finalizing AI insights..."
            ];

            let i = 0;
            const textElement = document.querySelector('.progress-text');
            setInterval(() => {
                textElement.innerText = messages[i % messages.length];
                i++;
            }, 3000);
        };
    </script>
</body>

</html>
